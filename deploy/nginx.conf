upstream ijwi_api {
    server api:5000;
    keepalive 32;
}

upstream ijwi_realtime {
    server realtime:5001;
}

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ---- REST API ----
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://ijwi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://ijwi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Payment webhooks: no rate limit, longer timeout ----
    location /api/v1/payments/webhook/ {
        proxy_pass http://ijwi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ---- Socket.IO ----
    location /socket.io/ {
        proxy_pass http://ijwi_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Uploaded media (served by nginx in production) ----
    location /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://ijwi_api;
    }
}
