version: "3.9"

x-backend-env: &backend-env
  FLASK_ENV: production
  DATABASE_URL: postgresql+psycopg2://ijwi:${POSTGRES_PASSWORD:-ijwi_dev}@postgres:5432/ijwi_ryajye
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  SOCKET_MESSAGE_QUEUE: redis://redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
  PAYMENT_WEBHOOK_SECRETS: ${PAYMENT_WEBHOOK_SECRETS}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ijwi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ijwi_dev}
      POSTGRES_DB: ijwi_ryajye
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijwi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/storage
    expose: ["5000"]

  realtime:
    build:
      context: .
      dockerfile: deploy/Dockerfile.realtime
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose: ["5001"]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    command: ["celery", "-A", "celery_app.celery", "worker", "-l", "info", "-c", "4"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    command: ["celery", "-A", "celery_app.celery", "beat", "-l", "info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - api
      - realtime

volumes:
  pgdata:
  redisdata:
  uploads:
