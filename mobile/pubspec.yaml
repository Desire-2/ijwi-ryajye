name: ijwi_ryajye
description: Ijwi Ryajye - agricultural communication & commerce platform for Rwanda.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
