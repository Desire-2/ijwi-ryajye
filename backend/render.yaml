services:
  # ── REST API ──────────────────────────────────────────────────────────
  - type: web
    name: ijwi-api
    env: docker
    buildContext: backend
    dockerfilePath: deploy/Dockerfile.api
    startCommand: ./deploy/start.sh
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ijwi-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SOCKET_MESSAGE_QUEUE
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRETS
        value: mock:dev-webhook-secret
      - key: SMS_PROVIDER
        value: mock
    healthCheckPath: /health

  # ── Realtime (Socket.IO) ─────────────────────────────────────────────
  - type: web
    name: ijwi-realtime
    env: docker
    buildContext: backend
    dockerfilePath: deploy/Dockerfile.realtime
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ijwi-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SOCKET_MESSAGE_QUEUE
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRETS
        value: mock:dev-webhook-secret
      - key: SMS_PROVIDER
        value: mock
    healthCheckPath: /health

  # ── Celery Worker ────────────────────────────────────────────────────
  - type: worker
    name: ijwi-worker
    env: docker
    buildContext: backend
    dockerfilePath: deploy/Dockerfile.api
    startCommand: celery -A celery_app.celery worker -l info -c 4
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ijwi-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SOCKET_MESSAGE_QUEUE
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRETS
        value: mock:dev-webhook-secret
      - key: SMS_PROVIDER
        value: mock

  # ── Celery Beat (scheduler) ──────────────────────────────────────────
  - type: cron
    name: ijwi-beat
    env: docker
    buildContext: backend
    dockerfilePath: deploy/Dockerfile.api
    startCommand: celery -A celery_app.celery beat -l info
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ijwi-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SOCKET_MESSAGE_QUEUE
        fromRedis:
          name: ijwi-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRETS
        value: mock:dev-webhook-secret
      - key: SMS_PROVIDER
        value: mock

databases:
  - name: ijwi-db
    plan: starter
    databaseName: ijwi_ryajye
    user: ijwi

  - name: ijwi-redis
    plan: starter
